              description: Altitude with WGS84 datum
              type: number
            longitude:
              description: Longitude with WGS84 datum
              type: number
            modifierExtension:
              description: Modifier Extensions
              type: array
              items:
                $ref: '#/components/schemas/Extension'
            extension:
              description: 'Additional Content defined by implementations - from Element: extension (recursive)'
              type: array
              items:
                $ref: '#/components/schemas/Extension'
            id:
              description: Internal id
              type: string
              pattern: ^[A-Za-z0-9\-\.]{1,64}$
            latitude:
              description: Latitude with WGS84 datum
              type: number
        hoursOfOperation:
          description: What days/times during a week is this location usually open
          type: array
          items:
            type: object
            properties:
              modifierExtension:
                description: Modifier Extensions
                type: array
                items:
                  $ref: '#/components/schemas/Extension'
              extension:
                description: 'Additional Content defined by implementations - from Element: extension (recursive)'
                type: array
                items:
                  $ref: '#/components/schemas/Extension'
              id:
                description: Internal id
                type: string
                pattern: ^[A-Za-z0-9\-\.]{1,64}$
              closingTime:
                description: Time that the Location closes
                type: string
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]+)?$
              allDay:
                description: The Location is open all day
                type: boolean
              openingTime:
                description: Time that the Location opens
                type: string
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]+)?$
              daysOfWeek:
                description: mon | tue | wed | thu | fri | sat | sun
                type: array
                items:
                  $ref: '#/components/schemas/code'
        telecom:
          description: Contact details of the location
          type: array
          items:
            $ref: '#/components/schemas/ContactPoint'
        physicalType:
          description: Physical form of the location
          allOf:
            - $ref: '#/components/schemas/CodeableConcept'
        type:
          description: Type of function performed
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
        description:
          description: Additional details about the location that could be displayed as further information to identify the location beyond its name
          type: string
        status:
          description: active | suspended | inactive
          enum:
            - active
            - suspended
            - inactive
          type: string
          pattern: ^[^\s]+([\s]+[^\s]+)*$
        partOf:
          description: Another Location this one is physically a part of
          allOf:
            - $ref: '#/components/schemas/Reference'
        alias:
          description: A list of alternate names that the location is known as, or was known as, in the past
          type: array
          items:
            type: string
