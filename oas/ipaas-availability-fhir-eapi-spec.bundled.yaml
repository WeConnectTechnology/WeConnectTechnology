  parameters:
    PractitionerCode:
      name: schedule.actor:Practitioner.identifier
      in: query
      required: false
      description: Practitioner Id
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    SpecialityCode:
      name: specialty
      in: query
      required: false
      description: Specialty
      schema:
        type: string
    TreatmentCode:
      name: service-type
      in: query
      required: false
      description: Service Type
      schema:
        type: string
    LocationId:
      name: schedule.location.identifier
      in: query
      required: false
      description: Location
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    PractitionerGender:
      name: schedule.actor:Practitioner.gender
      in: query
      required: false
      description: |
        Restricts results to slots associated with a practitioner of the specified administrative gender, following the FHIR AdministrativeGender ValueSet.
      schema:
        type: string
        enum:
          - male
          - female
          - unknown
    Dates:
      name: start
      in: query
      description: |
        Slot start date filter using FHIR prefixes:
           - `geYYYY-MM-DD` for start date greater than or equal
           - `leYYYY-MM-DD` for end date less than or equal

           Example:
           start=ge2026-05-01
           start=le2026-05-31
      required: true
      schema:
        type: string
        pattern: ^(ge|le)[0-9]{4}-[0-9]{2}-[0-9]{2}$
    AppointmentType:
      name: appointment-type
      in: query
      description: |
        Restricts the returned appointment slots to a specific care setting (Inpatient, Outpatient, or Daycase).  Values represent standard HL7 v3 ActEncounterCode tokens passed as 'system|code'. IMP (inpatient encounter) = Inpatient, AMB (ambulatory) = Outpatient, SS (short stay) = Daycase.
      required: false
      style: form
      explode: false
      schema:
        type: string
        enum:
          - hl7.org|IMP
          - hl7.org|AMB
          - hl7.org|SS
        example: hl7.org|AMB
    CYPEnabled:
      name: CYPEnabled
      in: query
      description: |
        Custom FHIR SearchParameter flag. Set to 'true' to restrict results to slots 
            actively configured or validated to accept Children and Young People.
      required: false
      schema:
        type: boolean
        example: true
    Insurer:
      name: insurer
      in: query
      description: |
        Custom FHIR SearchParameter token to filter slots by accepted insurance network. 
            Format follows the standard token structure 'system|code' or the raw identifier.
      required: false
      style: form
      explode: false
      schema:
        type: string
