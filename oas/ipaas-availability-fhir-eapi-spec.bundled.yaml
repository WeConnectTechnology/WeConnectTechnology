openapi: 3.0.0
info:
  version: 1.0.0
  title: ipaas-availability-fhir-eapi-spec
servers:
  - url: https://availability-fhir.5dwjf9.spirehealthcare.com/v1
    description: Production
  - url: https://pre-prod-availability-fhir.zhhb6n.spirehealthcare.com/v1
    description: Pre-Production
  - url: https://qa-availability-fhir.zhhb6n.spirehealthcare.com/v1
    description: qa
  - url: https://dev-availability-fhir.zhhb6n.spirehealthcare.com/v1
    description: dev
tags:
  - name: Availability
paths:
  /health-check:
    get:
      operationId: getApiHeartbeat
      summary: API Heartbeat
      description: API Heartbeat
      responses:
        '200':
          description: .
          headers:
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/app-status-response'
              examples:
                success:
                  $ref: '#/components/examples/api_status_response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /Slot:
    get:
      operationId: getSlots
      summary: Get Slots
      description: Get Available appointment Slots for Consultants and GPs
      parameters:
        - $ref: '#/components/parameters/PractitionerCode'
        - $ref: '#/components/parameters/SpecialityCode'
        - $ref: '#/components/parameters/TreatmentCode'
        - $ref: '#/components/parameters/LocationId'
        - $ref: '#/components/parameters/PractitionerGender'
        - $ref: '#/components/parameters/Dates'
        - $ref: '#/components/parameters/AppointmentType'
        - $ref: '#/components/parameters/CYPEnabled'
        - $ref: '#/components/parameters/Insurer'
      responses:
        '200':
          description: .
          headers:
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bundle'
        '400':
          description: Bad request (missing headers, structural issues).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/json:
              examples:
                badRequest:
                  $ref: '#/components/examples/400_invalid_input_parameter_badrequest'
                invalidDateRange:
                  $ref: '#/components/examples/400_invalid_date_range'
        '401':
          description: Unauthenticated (OAuth2 / mTLS failure).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
              examples:
                authError:
                  $ref: '#/components/examples/401_authentication_error'
        '403':
          description: Forbidden (insufficient scopes or policy).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
              examples:
                forbiddenError:
                  $ref: '#/components/examples/403_forbidden_error'
        '500':
          description: Server error.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
              examples:
                internalServerError:
                  $ref: '#/components/examples/500_internal_server_error-2'
        '503':
          description: Connectivity error.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
              examples:
                connectivityError:
                  $ref: '#/components/examples/503_connectivity_error'
        '504':
          description: Timeout error.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
              examples:
                timeOutError:
                  $ref: '#/components/examples/504_request_timed_out'
components:
  headers:
    X-Correlation-Id:
      description: Used for request correlation and distributed tracing across APIs.
      schema:
        type: string
      example: a6107d66-9e2e-49d0-89b4-3d472932eff3
    Content-Security-Policy:
      description: Prevents the page from being framed and restricts content sources
      schema:
        type: string
      example: frame-ancestors 'none'; default-src 'self'
    X-Content-Type-Options:
      description: Prevents MIME type sniffing
      schema:
        type: string
      example: nosniff
    Cache-Control:
      description: Prevents caching of responses
      schema:
        type: string
      example: no-store
    Referrer-Policy:
      description: Controls how much referrer information is sent
      schema:
        type: string
      example: strict-origin-when-cross-origin
  schemas:
    OperationOutcome:
      type: object
      description: |
        A collection of error, warning or information messages that result from a system action.
        Elements defined in Ancestors: id, meta, implicitRules, language, text, contained, extension, modifierExtension
      allOf:
        - $ref: '#/components/schemas/DomainResource-2'
      properties:
        resourceType:
          type: string
          description: This is a OperationOutcome resource
          enum:
            - OperationOutcome
        issue:
          type: array
          description: An error, warning or information message that results from a system action.
          items:
            $ref: '#/components/schemas/OperationOutcome_Issue'
          minItems: 1
      required:
        - resourceType
        - issue
    Bundle:
      type: object
      allOf:
        - $ref: '#/components/schemas/Bundle-2'
      properties:
        entry:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
    Entry:
      type: object
      properties:
        fullUrl:
          type: string
          description: URN/URL unique within the Bundle (e.g. urn:uuid:pat-aaaa)
        resource:
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/Slot-2'
                - type: object
                  properties:
                    resourceType:
                      type: string
                      enum:
                        - Slot
                  required:
                    - resourceType
            - allOf:
                - $ref: '#/components/schemas/Schedule-2'
                - type: object
                  properties:
                    resourceType:
                      type: string
                      enum:
                        - Schedule
                  required:
                    - resourceType
            - allOf:
                - $ref: '#/components/schemas/Location-3'
                - type: object
                  properties:
                    resourceType:
                      type: string
                      enum:
                        - Location
                  required:
                    - resourceType
            - allOf:
                - $ref: '#/components/schemas/HealthcareService-3'
                - type: object
                  properties:
                    resourceType:
                      type: string
                      enum:
                        - HealthcareService
                  required:
                    - resourceType
            - allOf:
                - $ref: '#/components/schemas/Practitioner-2'
                - type: object
                  properties:
                    resourceType:
                      type: string
                      enum:
                        - Practitioner
                  required:
                    - resourceType
            - allOf:
                - $ref: '#/components/schemas/Organization-3'
                - type: object
                  properties:
                    resourceType:
                      type: string
                      enum:
                        - Organization
                  required:
                    - resourceType
          discriminator:
            propertyName: resourceType
            mapping:
              Slot: '#/components/schemas/Slot-2'
              Schedule: '#/components/schemas/Schedule-2'
              Location: '#/components/schemas/Location-3'
              HealthcareService: '#/components/schemas/HealthcareService-3'
              Practitioner: '#/components/schemas/Practitioner-2'
              Organization: '#/components/schemas/Organization-3'
      required:
        - resource
    app-status-response:
      description: API health Check response
      type: object
      properties:
        name:
          description: Name of the API
          type: string
        status:
          description: API status
          type: string
        timestamp:
          description: Timestamp
          type: string
        hostname:
          description: API Hostname
          type: string
        businessGroupId:
          description: The ID uniquely identifies each business group in MuleSoft
          type: string
        environmentId:
          description: the Environment ID is the unique identifier for an environment (e.g., Sandbox, Design, Production)
          type: string
        ip:
          description: IP address
          type: string
        node:
          description: Node number
          type: string
        muleVersion:
          description: Mule Version
          type: string
        javaVersion:
          description: Java Version
          type: string
        cpu:
          description: Number of CPU allocated
          type: string
        memory:
          description: Memory Allocated.
          type: string
    ErrorResponse:
      description: The Data format for API Fault Responses
      type: object
      properties:
        header:
          type: object
          required:
            - transactionId
            - messageId
            - creationDateTimeStamp
            - uniqueIdentifier
          properties:
            transactionId:
              type: string
              description: Unique flow transaction identifier (UUID)
            messageId:
              type: string
              description: Unique message identifier (UUID)
            creationDateTimeStamp:
              type: string
              format: date-time
            uniqueIdentifier:
              type: string
        eventDetail:
          type: array
          items:
            type: object
            required:
              - errorItemType
              - errorCode
              - errorMessage
              - errorDetail
            properties:
              errorItemType:
                type: string
                enum:
                  - ERROR
                  - VALIDATION
              errorCode:
                type: string
              errorMessage:
                type: string
              errorDetail:
                type: string
      required:
        - header
        - eventDetail
    id:
      type: string
      pattern: ^[A-Za-z0-9\-\.]{1,64}$
      description: |
        Any combination of upper or lower case ASCII letters ('A'..'Z', and 'a'..'z', numerals ('0'..'9'), '-' and '.', with a length limit of 64 characters.
        (This might be an integer, an un-prefixed OID, UUID or any other identifier pattern that meets these constraints.)      
    enumvalueInteger:
      type: object
      properties:
        valueInteger:
          description: Value of extension.
          type: integer
    decimal:
      description: |
        Rational numbers that have a decimal representation. See below about the precision of the number.
        Regex: -?(0|[1-9][0-9]*)(\.[0-9]+)?([eE][+-]?[0-9]+)?
      type: number
    enumvalueDecimal:
      type: object
      properties:
        valueDecimal:
          description: Value of extension.
          $ref: '#/components/schemas/decimal'
    dateTime:
      type: string
      pattern: ^[0-9]{4}(-(0[1-9]|1[0-2])(-(0[0-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?$
      description: |
        A date, date-time or partial date (e.g. just year or year + month) as used in human communication. If hours and minutes are specified, a time zone SHALL be populated.
        Seconds must be provided due to schema type constraints but may be zero-filled and may be ignored. Dates SHALL be valid dates. The time "24:00" is not allowed      
    enumvalueDateTime:
      type: object
      properties:
        valueDateTime:
          description: Value of extension.
          $ref: '#/components/schemas/dateTime'
    date:
      type: string
      pattern: ^[0-9]{4}(-(0[1-9]|1[0-2])(-(0[0-9]|[1-2][0-9]|3[0-1]))?)?$
      description: |
        A date, or partial date (e.g. just year or year + month) as used in human communication. There is no time zone. Dates SHALL be valid dates
      example: '1970-08-07'
    enumvalueDate:
      type: object
      properties:
        valueDate:
          description: Value of extension.
          $ref: '#/components/schemas/date'
    instant:
      type: string
      pattern: ^[0-9]{4}(-(0[1-9]|1[0-2])(-(0[0-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))))$
      description: |
        An instant in time - known at least to the second and always includes a time zone.
        Note: This is intended for precisely observed times (typically system logs etc.), and not human-reported times - for them, use date and dateTime. instant is a more constrained dateTime.
        Note: This type is for system times, not human times (see date and dateTime).      
    enumvalueInstant:
      type: object
      properties:
        valueInstant:
          description: Value of extension.
          $ref: '#/components/schemas/instant'
    enumvalueString:
      type: object
      properties:
        valueString:
          description: Value of extension.
          type: string
    uri:
      description: |
        A Uniform Resource Identifier Reference (see: https://tools.ietf.org/html/rfc3986).
        Note: URIs are case sensitive. For UUID (urn:uuid:53fefa32-fcbb-4ff8-8a92-55ee120877b7) use all lowercase.
        URIs can be absolute or relative, and may have an optional fragment identifier.
        Regex: \S*
      type: string
    enumvalueUri:
      type: object
      properties:
        valueUri:
          description: Value of extension.
          $ref: '#/components/schemas/uri'
    enumvalueBoolean:
      type: object
      properties:
        valueBoolean:
          description: Value of extension.
          type: boolean
    code:
      type: string
      pattern: ^[^\s]+([\s]+[^\s]+)*
      description: |
        Indicates that the value is taken from a set of controlled strings defined elsewhere (see Using codes for further discussion).
        Technically, a code is restricted to a string which has at least one character and no leading or trailing whitespace, and where there is no whitespace other than single spaces in the contents.      
    enumvalueCode:
      type: object
      properties:
        valueCode:
          description: Value of extension.
          $ref: '#/components/schemas/code'
    base64Binary:
      type: string
      pattern: (\s*([0-9a-zA-Z\+\=]){4}\s*)+
      description: |
        There is no specified upper limit to the size of a binary, but systems will have to impose some implementation based limit to the size they support. This should be clearly documented, though there is no computable for this at this time    
    enumvalueBase64Binary:
      type: object
      properties:
        valueBase64Binary:
          description: Value of extension.
          $ref: '#/components/schemas/base64Binary'
    Extension:
      description: |
        Optional Extensions Element + Rule Must have either extensions or value[x], not both Elements defined in Ancestors id, extension
      type: object
      allOf:
        - $ref: '#/components/schemas/enumvalueInteger'
        - $ref: '#/components/schemas/enumvalueDecimal'
        - $ref: '#/components/schemas/enumvalueDateTime'
        - $ref: '#/components/schemas/enumvalueDate'
        - $ref: '#/components/schemas/enumvalueInstant'
        - $ref: '#/components/schemas/enumvalueString'
        - $ref: '#/components/schemas/enumvalueUri'
        - $ref: '#/components/schemas/enumvalueBoolean'
        - $ref: '#/components/schemas/enumvalueCode'
        - $ref: '#/components/schemas/enumvalueBase64Binary'
        - $ref: '#/components/schemas/enumvalueCoding'
        - $ref: '#/components/schemas/enumvalueCodeableConcept'
        - $ref: '#/components/schemas/enumvalueAttachment'
        - $ref: '#/components/schemas/enumvalueIdentifier'
        - $ref: '#/components/schemas/enumvalueQuantity'
        - $ref: '#/components/schemas/enumvalueRange'
        - $ref: '#/components/schemas/enumvaluePeriod'
        - $ref: '#/components/schemas/enumvalueRatio'
        - $ref: '#/components/schemas/enumvalueHumanName'
        - $ref: '#/components/schemas/enumvalueAddress'
        - $ref: '#/components/schemas/enumvalueContactPoint'
        - $ref: '#/components/schemas/enumvalueReference'
        - $ref: '#/components/schemas/enumvalueCanonical'
        - $ref: '#/components/schemas/enumvalueId'
        - $ref: '#/components/schemas/enumvalueMarkdown'
        - $ref: '#/components/schemas/enumvalueOid'
        - $ref: '#/components/schemas/enumvaluePositiveInt'
        - $ref: '#/components/schemas/enumvalueTime'
        - $ref: '#/components/schemas/enumvalueUnsignedInt'
        - $ref: '#/components/schemas/enumvalueUrl'
        - $ref: '#/components/schemas/enumvalueUuid'
        - $ref: '#/components/schemas/enumvalueAge'
        - $ref: '#/components/schemas/enumvalueAnnotation'
        - $ref: '#/components/schemas/enumvalueCount'
        - $ref: '#/components/schemas/enumvalueDistance'
        - $ref: '#/components/schemas/enumvalueDuration'
        - $ref: '#/components/schemas/enumvalueMoney'
        - $ref: '#/components/schemas/enumvalueSampledData'
        - $ref: '#/components/schemas/enumvalueSignature'
        - $ref: '#/components/schemas/enumvalueTiming'
        - $ref: '#/components/schemas/enumvalueContactDetail'
        - $ref: '#/components/schemas/enumvalueContributor'
        - $ref: '#/components/schemas/enumvalueDataRequirement'
        - $ref: '#/components/schemas/enumvalueExpression'
        - $ref: '#/components/schemas/enumvalueParameterDefinition'
        - $ref: '#/components/schemas/enumvalueRelatedArtifact'
        - $ref: '#/components/schemas/enumvalueTriggerDefinition'
        - $ref: '#/components/schemas/enumvalueUsageContext'
        - $ref: '#/components/schemas/enumvalueDosage'
        - $ref: '#/components/schemas/enumvalueMeta'
      properties:
        extension:
          $ref: '#/components/schemas/extension'
        url:
          description: identifies the meaning of the extension
          type: string
        id:
          description: Internal id
          pattern: ^[A-Za-z0-9\-\.]{1,64}$
          type: string
      required:
        - url
    Coding:
      description: |
        A Coding is a representation of a defined concept using a symbol from a defined "code system".
        See http://hl7.org/fhir/STU3/terminologies.html for more details.
      type: object
      properties:
        id:
          description: Internal id
          $ref: '#/components/schemas/id'
        extension:
          description: |
            Additional Content defined by implementations - from Element: extension (recursive)
          type: array
          items:
            $ref: '#/components/schemas/Extension'
        system:
          description: Identity of the terminology system
          $ref: '#/components/schemas/uri'
        version:
          description: Version of the system - if relevant
          type: string
        code:
          description: Symbol in syntax defined by the system
          $ref: '#/components/schemas/code'
        display:
          description: Representation defined by the system
          type: string
        userSelected:
          type: boolean
    enumvalueCoding:
      type: object
      properties:
        valueCoding:
          description: Value of extension.
          $ref: '#/components/schemas/Coding'
    CodeableConcept:
      description: |
        A CodeableConcept represents a value that is usually supplied by providing a reference to one or more terminologies or ontologies, but may also be defined by the provision of text.
        This is a common pattern in healthcare data.
      type: object
      properties:
        id:
          description: Internal id
          $ref: '#/components/schemas/id'
        extension:
          description: |
            Additional Content defined by implementations - from Element: extension (recursive)
          type: array
          items:
            $ref: '#/components/schemas/Extension'
        coding:
          description: Code defined by a terminology system
          type: array
          items:
            $ref: '#/components/schemas/Coding'
        text:
          description: Plain text representation of the concept
          type: string
    enumvalueCodeableConcept:
      type: object
      properties:
        valueCodeableConcept:
          description: Value of extension.
          $ref: '#/components/schemas/CodeableConcept'
    Element:
      type: object
      properties:
        id:
          description: Internal id
          $ref: '#/components/schemas/id'
        extension:
          description: |
            Additional Content defined by implementations - from Element: extension (recursive)
          type: array
          items:
            $ref: '#/components/schemas/Extension'
    unsignedInt:
      type: integer
      minimum: 0
      description: Any non-negative integer (e.g. >= 0) Regex - [0]|([1-9][0-9]*)
    Attachment:
      description: |
        This type is for containing or referencing attachments - additional data content defined in other formats.
        The most common use of this type is to include images or reports in some report format such as PDF.
        However it can be used for any data that has a MIME type.
      allOf:
        - $ref: '#/components/schemas/Element'
      type: object
      properties:
        contentType:
          description: Mime type of the content, with charset etc.
          $ref: '#/components/schemas/code'
        language:
          description: Human language of the content (BCP-47)
          $ref: '#/components/schemas/code'
        data:
          description: Data inline, base64ed
          $ref: '#/components/schemas/base64Binary'
        url:
          description: Uri where the data can be found
          $ref: '#/components/schemas/uri'
        size:
          description: Number of bytes of content (if url provided)
          $ref: '#/components/schemas/unsignedInt'
        hash:
          description: Hash of the data (sha-1, base64ed)
          $ref: '#/components/schemas/base64Binary'
        title:
          description: Label to display in place of the data
          type: string
        creation:
          description: Date attachment was first created
          $ref: '#/components/schemas/dateTime'
    enumvalueAttachment:
      type: object
      properties:
        valueAttachment:
          description: Value of extension.
          $ref: '#/components/schemas/Attachment'
    Period:
      description: A time period defined by a start and end date/time.
      allOf:
        - $ref: '#/components/schemas/Element'
      type: object
      properties:
        start:
          description: Starting time with inclusive boundary
          $ref: '#/components/schemas/dateTime'
        end:
          description: End time with inclusive boundary, if not ongoing
          $ref: '#/components/schemas/dateTime'
    assigner:
      description: Organization that issued id (may be just text)
      type: object
      properties:
        reference:
          description: Literal reference, Relative, internal or absolute URL
          type: string
        extension:
          $ref: '#/components/schemas/Extension'
        identifier:
          description: Logical reference, when literal reference is not known
          type: object
          properties:
            use:
              description: usual | official | temp | secondary (If known)
              pattern: ^[^\s]+([\s]+[^\s]+)*$
              enum:
                - usual
                - official
                - temp
                - secondary
                - old
              type: string
            type:
              description: Description of identifier
              type: object
              properties:
                extension:
                  $ref: '#/components/schemas/Extension'
                id:
                  description: Internal id
                  pattern: ^[A-Za-z0-9\-\.]{1,64}$
                  type: string
                coding:
                  description: Code defined by a terminology system
                  type: array
                  items:
                    $ref: '#/components/schemas/Coding'
                text:
                  description: Plain text representation of the concept
                  type: string
            system:
              description: The namespace for the identifier value
              type: string
            value:
              description: The value that is unique
              type: string
            period:
              description: Time period when id is/was valid for use
              type: object
              properties:
                extension:
                  $ref: '#/components/schemas/Extension'
                id:
                  description: Internal id
                  pattern: ^[A-Za-z0-9\-\.]{1,64}$
                  type: string
                start:
                  description: Starting time with inclusive boundary
                  pattern: ^[0-9]{4}(-(0[1-9]|1[0-2])(-(0[0-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?$
                  type: string
                end:
                  description: End time with inclusive boundary, if not ongoing
                  pattern: ^[0-9]{4}(-(0[1-9]|1[0-2])(-(0[0-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?$
                  type: string
            assigner:
              $ref: '#/components/schemas/assigner'
        id:
          description: Internal id
          pattern: ^[A-Za-z0-9\-\.]{1,64}$
          type: string
        display:
          description: Text alternative for the resource
          type: string
        type:
          description: Type the reference refers to (e.g. "Patient")
          type: string
    Identifier:
      description: |
        A numeric or alphanumeric string that is associated with a single object or entity within a given system.
        Typically, identifiers are used to connect content in resources to external content available in other frameworks or protocols.
        Identifiers are associated with objects, and may be changed or retired due to human or system process and errors.
      type: object
      properties:
        use:
          description: usual | official | temp | secondary (If known)
          allOf:
            - $ref: '#/components/schemas/code'
            - enum:
                - usual
                - official
                - temp
                - secondary
                - old
        type:
          description: Description of identifier
          $ref: '#/components/schemas/CodeableConcept'
        system:
          description: The namespace for the identifier value
          $ref: '#/components/schemas/uri'
        value:
          description: The value that is unique
          type: string
        period:
          description: Time period when id is/was valid for use
          $ref: '#/components/schemas/Period'
        assigner:
          description: Organization that issued id (may be just text)
          $ref: '#/components/schemas/assigner'
    enumvalueIdentifier:
      type: object
      properties:
        valueIdentifier:
          description: Value of extension.
          $ref: '#/components/schemas/Identifier'
    Quantity:
      description: A measured amount (or an amount that can potentially be measured).
      allOf:
        - $ref: '#/components/schemas/Element'
      type: object
      properties:
        value:
          description: Numerical value (with implicit precision)
          $ref: '#/components/schemas/decimal'
        comparator:
          description: how to understand the value
          type: string
          enum:
            - <
            - <=
            - '>='
            - '>'
        unit:
          description: Unit representation
          type: string
        system:
          description: System that defines coded unit form
          $ref: '#/components/schemas/uri'
        code:
          description: Coded form of the unit
          $ref: '#/components/schemas/code'
    enumvalueQuantity:
      type: object
      properties:
        valueQuantity:
          description: Value of extension.
          $ref: '#/components/schemas/Quantity'
    Range:
      description: A set of ordered Quantity values defined by a low and high limit.
      allOf:
        - $ref: '#/components/schemas/Element'
      type: object
      properties:
        low:
          description: Low limit
          $ref: '#/components/schemas/Quantity'
        high:
          description: High limit
          $ref: '#/components/schemas/Quantity'
    enumvalueRange:
      type: object
      properties:
        valueRange:
          description: Value of extension.
          $ref: '#/components/schemas/Range'
    enumvaluePeriod:
      type: object
      properties:
        valuePeriod:
          description: Value of extension.
          $ref: '#/components/schemas/Period'
    Ratio:
      description: A relationship between two Quantity values expressed as a numerator and a denominator.
      allOf:
        - $ref: '#/components/schemas/Element'
      type: object
      properties:
        numerator:
          description: Numerator value
          $ref: '#/components/schemas/Quantity'
        denominator:
          description: Denominator value
          $ref: '#/components/schemas/Quantity'
    enumvalueRatio:
      type: object
      properties:
        valueRatio:
          description: Value of extension.
          $ref: '#/components/schemas/Ratio'
    HumanName:
      description: |
        A name of a human with text, parts and usage information.
      allOf:
        - $ref: '#/components/schemas/Element'
      type: object
      properties:
        use:
          allOf:
            - $ref: '#/components/schemas/code'
            - enum:
                - usual
                - official
                - temp
                - nickname
                - anonymous
                - old
                - maiden
        text:
          description: Text representation of the full name
          type: string
        family:
          description: Family name (often called 'Surname')
          type: string
        given:
          description: Given names (not always 'first'). Includes middle names
          type: array
          items:
            type: string
        prefix:
          description: Parts that come before the name
          type: array
          items:
            type: string
        suffix:
          description: Parts that come after the name
          type: array
          items:
            type: string
        period:
          description: Time period when name was/is in use
          $ref: '#/components/schemas/Period'
    enumvalueHumanName:
      type: object
      properties:
        valueHumanName:
          description: Value of extension.
          $ref: '#/components/schemas/HumanName'
    Address:
      description: |
        An address expressed using postal conventions (as opposed to GPS or other location definition formats).
        This data type may be used to convey addresses for use in delivering mail as well as for visiting locations which might not be valid for mail delivery.
        There are a variety of postal address formats defined around the world.
      allOf:
        - $ref: '#/components/schemas/Element'
      type: object
      properties:
        use:
          description: home | work | temp | old - purpose of this address
          allOf:
            - $ref: '#/components/schemas/code'
            - enum:
                - home
                - work
                - temp
                - old
                - billing
        type:
          description: address type
          allOf:
            - $ref: '#/components/schemas/code'
            - enum:
                - postal
                - physical
                - both
        text:
          description: Text representation of the address
          type: string
        line:
          description: Street name, number, direction & P.O. Box etc.
          type: array
          items:
            type: string
        city:
          description: Name of city, town etc.
          type: string
        district:
          description: District name (aka county)
          type: string
        state:
          description: Sub-unit of country (abbreviations ok)
          type: string
        postalCode:
          description: Postal code for area
          type: string
        country:
          description: Country (e.g. can be ISO 3166 2 or 3 letter code)
          type: string
        period:
          description: Time period when address was/is in use
          $ref: '#/components/schemas/Period'
    enumvalueAddress:
      type: object
      properties:
        valueAddress:
          description: Value of extension.
          $ref: '#/components/schemas/Address'
    positiveInt:
      type: integer
      minimum: 1
      description: Any positive integer (e.g. >= 1) Regex - +?[1-9][0-9]*
    ContactPoint:
      description: |
        Details for all kinds of technology-mediated contact points for a person or organization, including telephone, email, etc.
      allOf:
        - $ref: '#/components/schemas/Element'
      type: object
      properties:
        system:
          allOf:
            - $ref: '#/components/schemas/code'
            - enum:
                - phone
                - fax
                - email
                - sms
                - pager
                - url
                - other
        value:
          description: The actual contact point details
          type: string
        use:
          description: purpose of this contact point
          allOf:
            - $ref: '#/components/schemas/code'
            - enum:
                - home
                - work
                - temp
                - old
                - mobile
        rank:
          description: Specify preferred order of use (1 = highest)
          $ref: '#/components/schemas/positiveInt'
        period:
          description: Time period when the contact point was/is in use
          $ref: '#/components/schemas/Period'
    enumvalueContactPoint:
      type: object
      properties:
        valueContactPoint:
          description: Value of extension.
          $ref: '#/components/schemas/ContactPoint'
    Reference:
      description: Many of the defined elements in a resource are references to other resources. Using these references, the resources combine to build a web of information about healthcare.
      allOf:
        - $ref: '#/components/schemas/Element'
      type: object
      properties:
        reference:
          description: Literal reference, Relative, internal or absolute URL
          type: string
        identifier:
          description: Logical reference, when literal reference is not known
          $ref: '#/components/schemas/Identifier'
        display:
          description: Text alternative for the resource
          type: string
        type:
          description: Type the reference refers to (e.g. "Patient")
          $ref: '#/components/schemas/uri'
    enumvalueReference:
      type: object
      properties:
        valueReference:
          description: Value of extension.
          $ref: '#/components/schemas/Reference'
    enumvalueCanonical:
      type: object
      properties:
        valueCanonical:
          description: Value of Extension
          $ref: '#/components/schemas/uri'
    enumvalueId:
      type: object
      properties:
        valueId:
          description: Value of Extension
          $ref: '#/components/schemas/id'
    markdown:
      type: string
      pattern: \s*(\S|\s)*
      description: A FHIR string (see above) that may contain markdown syntax for optional processing by a markdown presentation engine, in the GFM extension of CommonMark format
    enumvalueMarkdown:
      type: object
      properties:
        valueMarkdown:
          description: Value of Extension
          $ref: '#/components/schemas/markdown'
    oid:
      type: string
      pattern: urn:oid:[0-2](\.(0|[1-9][0-9]*))+
      description: |
        An OID represented as a URI (RFC 3001 ); e.g. urn:oid:1.2.3.4.5      
    enumvalueOid:
      type: object
      properties:
        valueOid:
          description: Value of Extension
