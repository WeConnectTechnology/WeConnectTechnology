    ParameterDefinition:
      description: |
        Definition of a parameter to a module
        Elements defined in Ancestors: id, extension
      allOf:
        - $ref: '#/components/schemas/Element'
      type: object
      properties:
        name:
          description: Name used to access the parameter value
          $ref: '#/components/schemas/code'
        use:
          description: in | out
          allOf:
            - $ref: '#/components/schemas/code'
            - enum:
              - in
              - out
        min:
          description: Minimum cardinality
          type: integer
        max:
          description: Maximum cardinality (a number of *)
          type: string
        documentation:
          description: A brief description of the parameter
          type: string
        type:
          $ref: '#/components/schemas/code'
        profile:
          description: What profile the value is expected to be
          $ref: '#/components/schemas/canonical'      
    RelatedArtifact:
      description: |
        Related artifacts for a knowledge resource
        Elements defined in Ancestors: id, extension
      allOf:
        - $ref: '#/components/schemas/Element'
      type: object
      properties:
        type:
          description: documentation | justification | citation | predecessor | successor | derived-from | depends-on | composed-of
          allOf:
            - $ref: '#/components/schemas/code'
            - enum:
              - documentation
              - justification
              - citation
              - predecessor
              - successor
              - derived-from
              - depends-on
              - composed-of
        label:
          description: Short label
          type: string
        display:
