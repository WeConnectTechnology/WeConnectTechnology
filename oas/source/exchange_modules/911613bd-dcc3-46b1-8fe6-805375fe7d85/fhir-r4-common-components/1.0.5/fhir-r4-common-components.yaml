            - $ref: '#/components/schemas/patternvalueHumanName'
            - $ref: '#/components/schemas/patternvalueAddress'
            - $ref: '#/components/schemas/patternvalueContactPoint'
            - $ref: '#/components/schemas/patternvalueReference'
