    enumvalueReference:
      type: object
      properties:
        valueReference:
          description: Value of extension.
          $ref: '#/components/schemas/Reference'
      required:
        - valueReference      
    enumvalueCanonical:
      type: object
      properties:
        valueCanonical:
          description: Value of Extension
          $ref: '#/components/schemas/canonical'
      required:
        - valueCanonical      
    enumvalueId:
      type: object
      properties:
        valueId:
          description: Value of Extension
          $ref: '#/components/schemas/id'
      required:
        - valueId      
    enumvalueMarkdown:
      type: object
      properties:
        valueMarkdown:
          description: Value of Extension
          $ref: '#/components/schemas/markdown'
      required:
