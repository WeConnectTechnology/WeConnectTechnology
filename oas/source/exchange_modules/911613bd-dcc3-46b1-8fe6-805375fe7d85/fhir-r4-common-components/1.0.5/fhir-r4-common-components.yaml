openapi: "3.0.0"
info:
  version: 1.0.0
  title: fhir-common-components
paths: {}
components:
  schemas:
    Extension:
      description: >
        Optional Extensions Element + Rule Must have either extensions or
        value[x], not both Elements defined in Ancestors id, extension
      type: object
      properties:           
        extension:
          $ref: "#/components/schemas/extension"  
        url:
          description: identifies the meaning of the extension
          type: string
        id:
          description: Internal id
          pattern: ^[A-Za-z0-9\-\.]{1,64}$
          type: string      
        value:
          description: Value of extension
          x-annotation-amf-union:
            - $ref: "#/components/schemas/enumvalueInteger"
            - $ref: "#/components/schemas/enumvalueDecimal"
            - $ref: "#/components/schemas/enumvalueDateTime"
            - $ref: "#/components/schemas/enumvalueDate"
            - $ref: "#/components/schemas/enumvalueInstant"
            - $ref: "#/components/schemas/enumvalueString"
            - $ref: "#/components/schemas/enumvalueUri"
            - $ref: "#/components/schemas/enumvalueBoolean"
            - $ref: "#/components/schemas/enumvalueCode"
            - $ref: "#/components/schemas/enumvalueBase64Binary"
            - $ref: "#/components/schemas/enumvalueCoding"
            - $ref: "#/components/schemas/enumvalueCodeableConcept"
            - $ref: "#/components/schemas/enumvalueAttachment"
            - $ref: "#/components/schemas/enumvalueIdentifier"
            - $ref: "#/components/schemas/enumvalueQuantity"
            - $ref: "#/components/schemas/enumvalueRange"
            - $ref: "#/components/schemas/enumvaluePeriod"
            - $ref: "#/components/schemas/enumvalueRatio"
            - $ref: "#/components/schemas/enumvalueHumanName"
            - $ref: "#/components/schemas/enumvalueAddress"
            - $ref: "#/components/schemas/enumvalueContactPoint"
            - $ref: "#/components/schemas/enumvalueReference"
            - $ref: "#/components/schemas/enumvalueCanonical"
            - $ref: "#/components/schemas/enumvalueId"
            - $ref: "#/components/schemas/enumvalueMarkdown"
            - $ref: "#/components/schemas/enumvalueOid"
            - $ref: "#/components/schemas/enumvaluePositiveInt"
            - $ref: "#/components/schemas/enumvalueTime"
            - $ref: "#/components/schemas/enumvalueUnsignedInt"
            - $ref: "#/components/schemas/enumvalueUrl"
            - $ref: "#/components/schemas/enumvalueUuid"
            - $ref: "#/components/schemas/enumvalueAge"
            - $ref: "#/components/schemas/enumvalueAnnotation"
            - $ref: "#/components/schemas/enumvalueCount"
            - $ref: "#/components/schemas/enumvalueDistance"
            - $ref: "#/components/schemas/enumvalueDuration"
            - $ref: "#/components/schemas/enumvalueMoney"
            - $ref: "#/components/schemas/enumvalueSampledData"
            - $ref: "#/components/schemas/enumvalueSignature"
            - $ref: "#/components/schemas/enumvalueTiming"
            - $ref: "#/components/schemas/enumvalueContactDetail"
            - $ref: "#/components/schemas/enumvalueContributor"
            - $ref: "#/components/schemas/enumvalueDataRequirement"
            - $ref: "#/components/schemas/enumvalueExpression"
            - $ref: "#/components/schemas/enumvalueParameterDefinition"
            - $ref: "#/components/schemas/enumvalueRelatedArtifact"
            - $ref: "#/components/schemas/enumvalueTriggerDefinition"
            - $ref: "#/components/schemas/enumvalueUsageContext"
            - $ref: "#/components/schemas/enumvalueDosage"
            - $ref: "#/components/schemas/enumvalueMeta"
          type: string
      required:
        - url
    extension:
      description: >
        Additional Content defined by implementations - from Element: extension
        (recursive)
      type: array
      items:
        $ref: "#/components/schemas/extension"
    decimal:
      description: |
        Rational numbers that have a decimal representation. See below about the precision of the number.
        Regex: -?(0|[1-9][0-9]*)(\.[0-9]+)?([eE][+-]?[0-9]+)?
      type: number
    uri:
      description: |
        A Uniform Resource Identifier Reference (see: https://tools.ietf.org/html/rfc3986).
        Note: URIs are case sensitive. For UUID (urn:uuid:53fefa32-fcbb-4ff8-8a92-55ee120877b7) use all lowercase.
        URIs can be absolute or relative, and may have an optional fragment identifier.
        Regex: \S*
      type: string
    url:
      description: |
        A Uniform Resource Locator (RFC 1738 ). Note URLs are accessed directly using the specified protocol. Common URL protocols are http{s}:, ftp:, mailto: and mllp:, though many others are defined.
      type: string
    canonical:
      description: |
        A URI that refers to a resource by its canonical URL (resources with a url property). The canonical type differs from a uri in that it has special meaning in this specification, and in that it may have a version appended, separated by a vertical bar (|). Note that the type canonical is not used for the actual canonical URLs that are the target of these references, but for the URIs that refer to them, and may have the version suffix in them. Like other URIs, elements of type canonical may also have #fragment references
      $ref: '#/components/schemas/uri'
    base64Binary:
      type: string
      pattern: (\s*([0-9a-zA-Z\+\=]){4}\s*)+
      description: |
        There is no specified upper limit to the size of a binary, but systems will have to impose some implementation based limit to the size they support. This should be clearly documented, though there is no computable for this at this time    
    instant:
      type: string
      pattern: ^[0-9]{4}(-(0[1-9]|1[0-2])(-(0[0-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))))$
      description: |
        An instant in time - known at least to the second and always includes a time zone.
        Note: This is intended for precisely observed times (typically system logs etc.), and not human-reported times - for them, use date and dateTime. instant is a more constrained dateTime.
        Note: This type is for system times, not human times (see date and dateTime).      
    date:
      type: string
      pattern: ^[0-9]{4}(-(0[1-9]|1[0-2])(-(0[0-9]|[1-2][0-9]|3[0-1]))?)?$
      description: |
        A date, or partial date (e.g. just year or year + month) as used in human communication. There is no time zone. Dates SHALL be valid dates
      example: '1970-08-07'      
    dateTime:
      type: string
      pattern: ^[0-9]{4}(-(0[1-9]|1[0-2])(-(0[0-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?$
      description: |
        A date, date-time or partial date (e.g. just year or year + month) as used in human communication. If hours and minutes are specified, a time zone SHALL be populated.
        Seconds must be provided due to schema type constraints but may be zero-filled and may be ignored. Dates SHALL be valid dates. The time "24:00" is not allowed      
    time:
      type: string
      pattern: ([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]+)?
      description: |
        A time during the day, with no date specified (can be converted to a Duration since midnight).
        Seconds must be provided due to schema type constraints but may be zero-filled and may be ignored.
        The time "24:00" is not allowed, and neither is a time zone.      
    code:
      type: string
      pattern: ^[^\s]+([\s]+[^\s]+)*
      description: |
        Indicates that the value is taken from a set of controlled strings defined elsewhere (see Using codes for further discussion).
        Technically, a code is restricted to a string which has at least one character and no leading or trailing whitespace, and where there is no whitespace other than single spaces in the contents.      
    oid:
      type: string
      pattern: urn:oid:[0-2](\.(0|[1-9][0-9]*))+
      description: |
        An OID represented as a URI (RFC 3001 ); e.g. urn:oid:1.2.3.4.5      
    id:
      type: string
      pattern: ^[A-Za-z0-9\-\.]{1,64}$
      description: |
        Any combination of upper or lower case ASCII letters ('A'..'Z', and 'a'..'z', numerals ('0'..'9'), '-' and '.', with a length limit of 64 characters.
        (This might be an integer, an un-prefixed OID, UUID or any other identifier pattern that meets these constraints.)      
    markdown:
      type: string
      pattern: \s*(\S|\s)*
      description: A FHIR string (see above) that may contain markdown syntax for optional processing by a markdown presentation engine, in the GFM extension of CommonMark format      
    unsignedInt:
      type: integer
      minimum: 0
      description: Any non-negative integer (e.g. >= 0) Regex - [0]|([1-9][0-9]*)      
    positiveInt:
      type: integer
      minimum: 1
      description: Any positive integer (e.g. >= 1) Regex - +?[1-9][0-9]*      
    uuid:
      type: string
      pattern: urn:uuid:^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      description: |
        A UUID (aka GUID) represented as a URI (RFC 4122 ); e.g. urn:uuid:c757873d-ec9a-4326-a141-556f43239520      
    dosageAsNeededBoolean:
      type: object
      properties:
        asNeededBoolean:
          description: Take "as needed"
          type: boolean
      required:
        - asNeededBoolean      
    dosageAsNeededCodeableConcept:
      type: object
      properties:
        asNeededCodeableConcept:
          description: Take "as needed"
          $ref: '#/components/schemas/CodeableConcept'
      required:
        - asNeededCodeableConcept      
    dosageDoseRange:
      type: object
      properties:
        doseRange:
          description: Amount of medication per dose
          $ref: '#/components/schemas/Range'      
    dosageDoseQuantity:
      type: object
      properties:
        doseQuantity:
          description: Amount of medication per dose
          $ref: '#/components/schemas/SimpleQuantity'      
    dosageRateRatio:
      type: object
      properties:
        rateRatio:
          description: Amount of medication per unit of timen
          $ref: '#/components/schemas/Ratio'      
    dosageRateRange:
      type: object
      properties:
        rateRange:
          description: Amount of medication per unit of time
          $ref: '#/components/schemas/Range'      
    dosageRateQuantity:
      type: object
      properties:
        rateQuantity:
          description: Amount of medication per unit of time
          $ref: '#/components/schemas/SimpleQuantity'    
    dosageAsNeeded:
      oneOf:
        - $ref: '#/components/schemas/dosageAsNeededBoolean'
        - $ref: '#/components/schemas/dosageAsNeededCodeableConcept'
    dosageRate:
      oneOf:
        - $ref: '#/components/schemas/dosageRateRatio'
        - $ref: '#/components/schemas/dosageRateRange'
        - $ref: '#/components/schemas/dosageRateQuantity'  
    Dosage:
      description: How the medication is/was taken or should be taken     
      allOf:
        - $ref: '#/components/schemas/BackboneElement'
        - $ref: '#/components/schemas/dosageAsNeededBoolean'
        - $ref: '#/components/schemas/dosageAsNeededCodeableConcept'
      type: object
      properties:
        sequence:
          description: The order of the dosage instructions
          type: integer
        text:
          description: Free text dosage instructions e.g. SIG
          type: string
        additionalInstruction:
          description: Supplemental instruction - e.g. "with meals"
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
        patientInstruction:
          description: Patient or consumer oriented instructions
          type: string
        timing:
          description: When medication should be administered
          $ref: '#/components/schemas/Timing'        
        site:
          description: Body site to administer to
          $ref: '#/components/schemas/CodeableConcept'
        route:
          description: How drug should enter body
          $ref: '#/components/schemas/CodeableConcept'
        method:
          description: Technique for administering medication
          $ref: '#/components/schemas/CodeableConcept'
        doseAndRate:
          type: array
          items:
            type: object
            allOf:
              - $ref: '#/components/schemas/Element'
              - $ref: '#/components/schemas/dosageRateRatio'
              - $ref: '#/components/schemas/dosageRateRange'
              - $ref: '#/components/schemas/dosageRateQuantity'
            properties:
              type:
                description: The kind of dose or rate specified
                $ref: '#/components/schemas/CodeableConcept'
        maxDosePerPeriod:
          description: Upper limit on medication per unit of time
          $ref: '#/components/schemas/Ratio'
        maxDosePerAdministration:
          description: Upper limit on medication per administration
          $ref: '#/components/schemas/SimpleQuantity'
        maxDosePerLifetime:
          description: Upper limit on medication per lifetime of the patient
          $ref: '#/components/schemas/SimpleQuantity'  
    
      
    xhtml:
      description: |
        Limited xhtml content (Escaped XHTML)
      type: string
    Narrative:
      type: object
      description: |
        Any resource that is a DomainResource (almost all types of resource) may include a human-readable narrative that contains a summary of the resource,
        and may be used to represent the content of the resource to a human.
      properties:
        status:
          enum:
            - generated
            - extensions
            - additional
            - empty
          $ref: '#/components/schemas/code'
        div:
          description: Limited xhtml content
          $ref: '#/components/schemas/xhtml'
      required:
        - status
        - div      
    Meta:
      description: |
        Each resource contains an element "meta", of type "Meta", which is a set of metadata that provides technical and workflow context to the resource.
        The metadata items are all optional, though some or all of them may be required in particular implementations or contexts of use.
      allOf:
        - $ref: '#/components/schemas/Element'
      type: object
      properties:
        versionId:
          description: Version specific identifier
          $ref: '#/components/schemas/id'
        lastUpdated:
          description: When the resource version last changed
          $ref: '#/components/schemas/instant'
        source:
          description: Identifies where the resource comes from
          $ref: '#/components/schemas/uri'
        profile:
          description: Profiles this resource claims to conform to
          type: array
          items:
            $ref: '#/components/schemas/canonical'
        security:
          description: Security Labels applied to this resource
          type: array
          items:
            $ref: '#/components/schemas/Coding'
        tag:
              description: Tags applied to this resource
              type: array
              items:
                $ref: '#/components/schemas/Coding'      
    ContactDetail:
      description: |
        Contact information Elements defined in Ancestors: id, extension
      allOf:
        - $ref: '#/components/schemas/Element'
      type: object
      properties:
        name:
          description: Name of an individula to contact
          type: string
        telecom:
          description: Contact details for individual or organization
          type: array
          items:
            $ref: '#/components/schemas/ContactPoint'      
    Age:
      description: An age value
      $ref: '#/components/schemas/Quantity'
    SimpleQuantity:
      description: The comparator is not used on a SimpleQuantity
      $ref: '#/components/schemas/Quantity'
    Distance:
      description: A distance value
      $ref: '#/components/schemas/Quantity'
    Count:
      description: A count value
      $ref: '#/components/schemas/Quantity'
    Reference:
      description: Many of the defined elements in a resource are references to other resources. Using these references, the resources combine to build a web of information about healthcare.
      allOf:
        - $ref: '#/components/schemas/Element'
      type: object
      properties:
        reference:
          description: Literal reference, Relative, internal or absolute URL
          type: string
        identifier:
          description: Logical reference, when literal reference is not known
          $ref: '#/components/schemas/Identifier'
        display:
          description: Text alternative for the resource
          type: string
        type:
          description: Type the reference refers to (e.g. "Patient")
          $ref: '#/components/schemas/uri'      
    Element:
      type: object
      properties:
        id:
          description: Internal id
          $ref: '#/components/schemas/id'
        extension:
          description: |
            Additional Content defined by implementations - from Element: extension (recursive)
          type: array
          items:
            $ref: '#/components/schemas/Extension'
    enumvalueInteger:
      type: object
      properties:
        valueInteger:
          description: Value of extension.
          type: integer
      required:
        - valueInteger      
    enumvalueDecimal:
      type: object
      properties:
        valueDecimal:
          description: Value of extension.
          $ref: '#/components/schemas/decimal'
      required:
        - valueDecimal      
    enumvalueDateTime:
      type: object
      properties:
        valueDateTime:
          description: Value of extension.
          $ref: '#/components/schemas/dateTime'
      required:
        - valueDateTime      
    enumvalueDate:
      type: object
      properties:
        valueDate:
          description: Value of extension.
          $ref: '#/components/schemas/date'
      required:
        - valueDate      
    enumvalueInstant:
      type: object
      properties:
        valueInstant:
          description: Value of extension.
          $ref: '#/components/schemas/instant'
      required:
        - valueInstant      
    enumvalueString:
      type: object
      properties:
        valueString:
          description: Value of extension.
          type: string
      required:
        - valueString      
    enumvalueUri:
      type: object
      properties:
        valueUri:
          description: Value of extension.
          $ref: '#/components/schemas/uri'
      required:
        - valueUri      
    enumvalueBoolean:
      type: object
      properties:
        valueBoolean:
          description: Value of extension.
          type: boolean
      required:
        - valueBoolean      
    enumvalueCode:
      type: object
      properties:
        valueCode:
          description: Value of extension.
          $ref: '#/components/schemas/code'
      required:
        - valueCode      
    enumvalueBase64Binary:
      type: object
      properties:
        valueBase64Binary:
          description: Value of extension.
          $ref: '#/components/schemas/base64Binary'
      required:
        - valueBase64Binary      
    enumvalueCoding:
      type: object
      properties:
        valueCoding:
          description: Value of extension.
          $ref: '#/components/schemas/Coding'
      required:
        - valueCoding      
    enumvalueCodeableConcept:
      type: object
      properties:
        valueCodeableConcept:
          description: Value of extension.
          $ref: '#/components/schemas/CodeableConcept'
      required:
        - valueCodeableConcept      
    enumvalueAttachment:
      type: object
      properties:
        valueAttachment:
          description: Value of extension.
          $ref: '#/components/schemas/Attachment'
      required:
        - valueAttachment      
    enumvalueIdentifier:
      type: object
      properties:
        valueIdentifier:
          description: Value of extension.
          $ref: '#/components/schemas/Identifier'
      required:
        - valueIdentifier      
    enumvalueQuantity:
      type: object
      properties:
        valueQuantity:
          description: Value of extension.
          $ref: '#/components/schemas/Quantity'
      required:
        - valueQuantity      
    enumvalueRange:
      type: object
      properties:
        valueRange:
          description: Value of extension.
          $ref: '#/components/schemas/Range'
      required:
        - valueRange      
    enumvaluePeriod:
      type: object
      properties:
        valuePeriod:
          description: Value of extension.
          $ref: '#/components/schemas/Period'
      required:
        - valuePeriod      
    enumvalueRatio:
      type: object
      properties:
        valueRatio:
          description: Value of extension.
          $ref: '#/components/schemas/Range'
      required:
        - valueRatio      
    enumvalueHumanName:
      type: object
      properties:
        valueHumanName:
          description: Value of extension.
          $ref: '#/components/schemas/HumanName'
      required:
        - valueHumanName      
    enumvalueAddress:
      type: object
      properties:
        valueAddress:
          description: Value of extension.
          $ref: '#/components/schemas/Address'
      required:
        - valueAddress      
    enumvalueContactPoint:
      type: object
      properties:
        valueContactPoint:
          description: Value of extension.
          $ref: '#/components/schemas/ContactPoint'
      required:
