openapi: "3.0.0"
info:
  version: 1.0.0
  title: OperationOutcome
paths: {}
components: 
  schemas:
    OperationOutcome:
      type: object
      description: |
        A collection of error, warning or information messages that result from a system action.
        Elements defined in Ancestors: id, meta, implicitRules, language, text, contained, extension, modifierExtension
      allOf:
        - $ref: '../../../../../../exchange_modules/911613bd-dcc3-46b1-8fe6-805375fe7d85/fhir-r4-common-components/1.0.7/fhir-r4-common-components.yaml#/components/schemas/DomainResource'
      properties:
        resourceType:
          type: string
          description: This is a OperationOutcome resource
          enum: [OperationOutcome]
        issue:
          type: array
          description: An error, warning or information message that results from a system action.
          items:
            $ref: '#/components/schemas/OperationOutcome_Issue'
          minItems: 1
      required:
        - resourceType
        - issue

    OperationOutcome_Issue:
      type: object
      description: |
        A collection of error, warning or information messages that result from a system action.
        Elements defined in Ancestors: id, extension, modifierExtension
      allOf:
        - $ref: '../../../../../../exchange_modules/911613bd-dcc3-46b1-8fe6-805375fe7d85/fhir-r4-common-components/1.0.7/fhir-r4-common-components.yaml#/components/schemas/BackboneElement'
      properties:
        severity:
          type: string
          description: Indicates whether the issue indicates a variation from successful processing.
          enum:
            - fatal
            - error
            - warning
            - information
            - success
        code:
          type: string
          description: |
            Describes the type of the issue. The system that creates an OperationOutcome SHALL choose the most applicable code from the IssueType value set, 
            and may additional provide its own code for the error in the details element.
          pattern: ^[^\s]+( [^\s]+)*
        details:
          description: Additional details about the error. This may be a text description of the error, or a system code that identifies the error.
          $ref: '../../../../../../exchange_modules/911613bd-dcc3-46b1-8fe6-805375fe7d85/fhir-r4-common-components/1.0.7/fhir-r4-common-components.yaml#/components/schemas/CodeableConcept'
        diagnostics:
          type: string
          description: |
            Additional diagnostic information about the issue. Typically, this may be a description of how a value is erroneous, 
            or a stack dump to help trace the issue.
        location:
          type: string
          description: |
            For resource issues, this will be a simple XPath limited to element names, repetition indicators and the default child access 
            that identifies one of the elements in the resource that caused this issue to be raised. For HTTP errors, will be "http." + the parameter name.
        expression:
          type: string
          description: |
            A simple FHIRPath limited to element names, repetition indicators and the default child access that identifies one of the elements 
            in the resource that caused this issue to be raised.
          
