          example: "strict-origin-when-cross-origin"
      content:
        application/json:
          schema: 
            $ref: 'api-response.yaml#/components/schemas/ErrorResponse' 
          examples:
            authError:
              $ref: '../../examples/errors/non-fhir/401_unauthorized.yaml'

